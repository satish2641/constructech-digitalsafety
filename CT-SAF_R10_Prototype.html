<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CT-SAF R10 Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed white sidebar (240px) + sticky top bar + card grid; phone: top bar + bottom tab bar + "More" sheet */
:root{
  --red:#d50c19;--red-d:#b30a15;--red-50:#fff1f2;--red-100:#fbd5d8;
  --ink:#1d2026;--ink-2:#3a3e46;--mut:#6b7079;--mut-2:#9a9ea6;
  --bg:#f4f5f7;--card:#ffffff;--soft:#f7f8fa;--line:#e4e6ea;--line-2:#f0f1f3;
  --ok:#1f7a52;--ok-b:#e7f4ed;--warn:#9a5b00;--warn-b:#fdf3e1;--info:#2d5b9a;--info-b:#eaf1fa;--nt-b:#eef0f3;
  --bar:#1d2026;--logo-bg:transparent;--wm-op:.03;--wm-filter:none;--wm-blend:multiply;--shadow:0 1px 2px rgba(20,22,26,.05);
  --font:"Inter","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --red:#e8323e;--red-d:#ff5a64;--red-50:#3a1a1e;--red-100:#5a242b;
  --ink:#eef0f3;--ink-2:#d3d6dc;--mut:#a3a8b1;--mut-2:#7d838d;
  --bg:#14161a;--card:#1c1f24;--soft:#22262c;--line:#30353d;--line-2:#272b31;
  --ok:#7fd1a9;--ok-b:#173327;--warn:#f0c27a;--warn-b:#3a2f1b;--info:#9bbcea;--info-b:#1c2a3d;--nt-b:#2a2e35;
  --bar:#cfd3da;--logo-bg:#ffffff;--wm-op:.035;--wm-filter:grayscale(1) invert(1);--wm-blend:screen;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --red:#e8323e;--red-d:#ff5a64;--red-50:#3a1a1e;--red-100:#5a242b;
  --ink:#eef0f3;--ink-2:#d3d6dc;--mut:#a3a8b1;--mut-2:#7d838d;
  --bg:#14161a;--card:#1c1f24;--soft:#22262c;--line:#30353d;--line-2:#272b31;
  --ok:#7fd1a9;--ok-b:#173327;--warn:#f0c27a;--warn-b:#3a2f1b;--info:#9bbcea;--info-b:#1c2a3d;--nt-b:#2a2e35;
  --bar:#cfd3da;--logo-bg:#ffffff;--wm-op:.035;--wm-filter:grayscale(1) invert(1);--wm-blend:screen;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg{flex:none}
.num{font-variant-numeric:tabular-nums}

/* sidebar */
.side{position:fixed;top:0;bottom:0;left:0;width:240px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:20}
.brand{display:grid;gap:7px;width:172px;margin:4px 0 18px 10px}.logo{display:block;width:172px;height:auto;margin:0;border-radius:2px;background:var(--logo-bg);box-shadow:0 0 0 4px var(--logo-bg)}.mlogo{border-radius:2px;background:var(--logo-bg);box-shadow:0 0 0 3px var(--logo-bg)}
.cap{display:flex;justify-content:space-between;width:172px;font-size:10.5px;line-height:1;color:var(--mut);font-weight:600}
.grp{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut-2);font-weight:600;margin:14px 10px 6px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:7px;background:none;color:var(--ink-2);font-weight:500;text-align:left;position:relative;margin-bottom:1px}
.nav button svg{color:var(--mut-2)}
.nav button:hover{background:var(--soft)}
.nav button[aria-current="page"]{background:var(--red-50);color:var(--red);font-weight:600}
.nav button[aria-current="page"] svg{color:var(--red)}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--red)}
.badge{margin-left:auto;font-size:11px;font-weight:600;background:var(--nt-b);color:var(--ink-2);border-radius:20px;padding:1px 8px}
.badge.r{background:var(--red);color:#fff}
.sfoot{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;font-size:12px;color:var(--mut);display:grid;gap:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22a06b;margin-right:6px;box-shadow:0 0 0 3px rgba(34,160,107,.18)}

/* top bar */
.main{margin-left:240px;min-width:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;height:60px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:0;padding-left:26px;padding-right:max(26px,env(safe-area-inset-right,0px))}
.crumb{white-space:nowrap;color:var(--mut);font-size:12.5px}.crumb b{color:var(--ink)}
.srch{flex:0 1 360px;min-width:140px;margin-left:16px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:7px 10px;color:var(--mut)}
.srch span:not(.kbd){flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.kbd{font-size:11px;border:1px solid var(--line);background:var(--card);border-radius:4px;padding:0 5px;white-space:nowrap}
.sp{flex:1}
.chip{white-space:nowrap;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:500;color:var(--ink-2);background:var(--card)}
.chip:hover{border-color:var(--mut-2)}
.av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:600;font-size:11.5px}
.mlogo,.msrch{display:none}

/* content */
.wrap{padding-block:22px 48px;padding-left:26px;padding-right:max(26px,env(safe-area-inset-right,0px));max-width:1400px}
.demo{display:flex;align-items:center;gap:10px;background:var(--info-b);color:var(--info);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:10px}
.bgbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:18px;font-size:12.5px}
.bgpick{display:flex;gap:8px;flex-wrap:wrap}
.bgpick button{width:30px;height:30px;border-radius:50%;background:var(--sw);border:1px solid #c9ccd2;padding:0}
.bgpick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--red)}
.bggrid{flex-basis:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px}
.bgg{display:grid;gap:6px}.bgl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
@media (max-width:900px){.bggrid{grid-template-columns:1fr 1fr}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"])[data-bg]{--bg:#14161a}}:root[data-theme="dark"][data-bg]{--bg:#14161a}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.ph p{margin:3px 0 0;color:var(--mut)}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border-radius:7px;padding:8px 14px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--mut-2)}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red-d)}
.btn.d{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px}
.h2 .s{color:var(--mut);font-weight:400;font-size:12px}
.lk{margin-left:auto;color:var(--red);font-size:12.5px;font-weight:600;background:none;border:0;padding:0}
.lk:hover{text-decoration:underline}
.sect{margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}

/* quick actions + KPIs */
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.qa button{padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;box-shadow:var(--shadow)}
.qa button:hover{border-color:var(--mut-2)}
.qi{width:36px;height:36px;border-radius:9px;background:var(--soft);display:grid;place-items:center;color:var(--ink-2);flex:none}
.qa b{display:block;font-size:13.5px}.qa small{color:var(--mut);font-size:12px}
.qa .main1{border-color:var(--red-100);background:var(--red-50)}.qa .main1 .qi{background:var(--red);color:#fff}
.kp{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:16px}
.kp>button{padding:14px 14px 12px;position:relative;overflow:hidden;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;box-shadow:var(--shadow)}
.kp>button:hover{border-color:var(--mut-2)}
.kp .n{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kp .l{color:var(--mut);font-size:12px;min-height:34px}
.kp .alert{border-color:var(--red-100)}.kp .alert::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--red)}.kp .alert .n{color:var(--red)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.ok{background:var(--ok-b);color:var(--ok)}.wn{background:var(--warn-b);color:var(--warn)}.rd{background:var(--red-50);color:var(--red)}.nt{background:var(--nt-b);color:var(--ink-2)}.in{background:var(--info-b);color:var(--info)}
.kp .pill{margin-top:8px;font-size:11px}

/* stepper */
.flow{display:grid;grid-template-columns:repeat(4,1fr);padding:14px 16px;gap:8px}
.st{display:flex;gap:10px;position:relative}
.st .c{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--mut);flex:none;background:var(--card)}
.st.dn .c{background:var(--ok);border-color:var(--ok);color:var(--card)}
.st.cur .c{border-color:var(--red);color:var(--red)}
.st b{display:block;font-size:13px}.st small{color:var(--mut);font-size:12px;display:block}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut-2);font-weight:600;padding:9px 16px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
td{padding:10px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--soft)}
.id{color:var(--red);font-weight:700;white-space:nowrap}
.sub{color:var(--mut);font-size:12px;display:block}
.empty{padding:26px 16px;color:var(--mut);display:flex;gap:10px;align-items:center}
.empty .ic{width:32px;height:32px;border-radius:50%;background:var(--ok-b);color:var(--ok);display:grid;place-items:center}

/* filter bar */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.fin{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--card);color:var(--mut);flex:1 1 220px;max-width:340px}
.fin input{border:0;outline:0;background:none;color:var(--ink);font:inherit;width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 11px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.cnt{color:var(--mut);font-size:12px;margin-left:auto}

/* chart */
.chart{padding:16px 16px 6px}
.chart svg{width:100%;height:auto;display:block}
.site{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.site b{width:150px}
.prog{flex:1;min-width:80px;height:7px;border-radius:5px;background:var(--nt-b);overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}

/* kanban (permits) */
.board{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;padding:14px 16px;overflow-x:auto}
.col h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:flex;justify-content:space-between}
.pcard{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;font-size:12.5px}
.pcard b{display:block;color:var(--red)}

/* wizard */
.wiz{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.wiz span{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:6px 10px;border-radius:20px;font-size:12.5px;font-weight:500;color:var(--mut);background:var(--soft)}
.wiz span.on{background:var(--red-50);color:var(--red)}
.wiz span.dn{background:var(--ok-b);color:var(--ok)}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px}
.f{display:grid;gap:5px;font-size:12px;font-weight:600;color:var(--ink-2)}
.f .in2{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--card);font-weight:400;font-size:13.5px;color:var(--ink);min-height:36px}
.f.wide{grid-column:1/-1}
.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px}
.wk{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.wk .bx{width:18px;height:18px;border-radius:4px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.wk.on{border-color:var(--ok);background:var(--ok-b)}.wk.on .bx{background:var(--ok);border-color:var(--ok);color:var(--card)}
.wk.no{opacity:.7}
.wk div{min-width:0}
.risk{display:inline-grid;place-items:center;width:28px;height:22px;border-radius:5px;font-weight:700;font-size:12px}
.rL{background:var(--ok-b);color:var(--ok)}.rM{background:var(--warn-b);color:var(--warn)}.rH{background:var(--red-50);color:var(--red)}

/* mobile chrome */
.bb{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:14px 14px 0 0;z-index:41;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet .grid button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:12px;font-weight:500}

/* command palette */
.pal-bg{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:12vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.pal{width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.pal .fin{max-width:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 14px}
.pal ul{list-style:none;margin:0;padding:6px;max-height:340px;overflow:auto}
.pal li button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 10px;border-radius:7px;text-align:left}
.pal li button:hover,.pal li button.act{background:var(--soft)}
.pal .k{margin-left:auto;font-size:11px;color:var(--mut)}

.rolebox .rolehd{display:grid;gap:4px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.rlist{display:grid;gap:8px;padding:12px}
.rlist button{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:12px}
.rlist button:hover{border-color:var(--mut-2)}
.rlist button[aria-pressed="true"]{border-color:var(--red);background:var(--red-50)}
.rad{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px}
.rlist button[aria-pressed="true"] .rad{border:5px solid var(--red)}
body[data-role="site"] .mgr{display:none}
.datebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dnav{width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-size:18px;line-height:1;color:var(--ink-2)}
.dnav:disabled{opacity:.35;cursor:not-allowed}
.dpick{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:7px;font-weight:600;white-space:nowrap}
.dnav:hover:not(:disabled),.dpick:hover{border-color:var(--mut-2)}
.pastbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--warn-b);color:var(--warn);border-radius:8px;padding:9px 12px;margin-bottom:16px;font-size:13px}
.pastbar span{flex:1 1 300px;min-width:0}
.cal{max-width:360px}
.calh{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:12px 14px}
.calg .dw{font-size:11px;color:var(--mut-2);text-align:center;font-weight:600;padding-bottom:4px}
.cd{position:relative;height:38px;border:0;border-radius:8px;background:none;font-weight:500;font-variant-numeric:tabular-nums}
.cd:hover:not(:disabled){background:var(--soft)}
.cd:disabled{color:var(--mut-2);opacity:.45;cursor:not-allowed}
.cd i{position:absolute;left:50%;bottom:5px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--ok)}
.cd.tdy{box-shadow:inset 0 0 0 1.5px var(--red);color:var(--red);font-weight:700}
.cd.sel{background:var(--red);color:#fff}.cd.sel i{background:#fff}
.calf{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line)}
.dotk{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
@media (max-width:1366px){.dlt{display:none}}@media (max-width:1100px){.chip.role .t{display:none}}
/* dashboard watermark: company logo at low opacity behind the cards */
.wm{position:fixed;left:240px;right:0;top:60px;bottom:0;pointer-events:none;z-index:12;mix-blend-mode:var(--wm-blend);display:none;background-repeat:no-repeat;background-position:center 58%;background-size:min(62%,760px) auto;opacity:var(--wm-op);filter:var(--wm-filter)}
body[data-view="home"] .wm{display:block}
.main{position:relative}.wrap{position:relative;z-index:1}
@media (max-width:900px){.wm{left:0;top:56px;bottom:62px;background-size:86% auto}}
.donestep{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-2)}.donestep:last-of-type{border-bottom:0}
.dn-n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.rabacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:8px;font-weight:500;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2)}

@media (max-width:1280px){.qa{grid-template-columns:repeat(3,1fr)}.kp{grid-template-columns:repeat(4,1fr)}}
@media (max-width:1100px){.g3{grid-template-columns:1fr 1fr}.crumb{display:none}.srch{margin-left:0}}
@media (max-width:900px){
  .side{display:none}.main{margin-left:0}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));height:56px}
  .mlogo{display:block;width:128px}.msrch{display:grid;place-items:center;width:36px;height:36px;border:0;background:none;color:var(--mut)}
  .srch,.chip.hide-m,.crumb{display:none}
  .chip.role span.t{display:none}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  .g2,.g3{grid-template-columns:1fr}
  .qa{grid-template-columns:1fr 1fr}.qa small{display:none}
  .kp{grid-template-columns:1fr 1fr}
  .flow{grid-template-columns:1fr 1fr;row-gap:14px}
  .form{grid-template-columns:1fr 1fr}.roster{grid-template-columns:1fr 1fr}
  .ph h1{font-size:20px}.ph .acts{margin-left:0}
  .bb{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  .bb button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:62px;border:0;background:none;font-size:10.5px;color:var(--mut);font-weight:500;position:relative}
  .bb button[aria-current="page"]{color:var(--red)}
  .bb button[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--red);border-radius:0 0 3px 3px}
  .bb .bd{position:absolute;top:8px;left:calc(50% + 4px);background:var(--red);color:#fff;font-size:9.5px;border-radius:9px;padding:0 5px}
  th:nth-child(n+5),td:nth-child(n+5){display:none}
}
@media (max-width:520px){
  .qa,.kp{grid-template-columns:1fr 1fr}.qa button{flex-direction:column;gap:8px}
  .form,.roster{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .chip.role{padding:4px}
  th:nth-child(n+4),td:nth-child(n+4){display:none}
}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}

const TODAY=new Date(2026,10,12);let selDate=new Date(TODAY);let calMonth=new Date(2026,10,1);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONL=['January','February','March','April','May','June','July','August','September','October','November','December'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const sameDay=(a,b)=>a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate();

function ptwNo(d,i){const n=Math.round((d-new Date(2026,9,1))/864e5)*0+Math.max(1,Math.round((d-new Date(2026,8,1))/864e5/7))+i;return 'PTW-'+String(n).padStart(4,'0')}

  const b=sitesDone>1?Math.floor(so/2):0,t=so-b;
  let log=[];

    for(let i=0;i<ptw;i++){const ty=types[Math.floor(seed(d,9+i)*4)];const no=ptwNo(d,i);log.push(['0'+(7+i)+':1'+i,'Permit',no+' raised – '+ty[0],ty[1],'in',ty[2]]);log.push(['17:'+(20+i*10),'Permit',no+' closed out',ty[1],'ok',ty[2]]);}
    const fm=['MEWP pre-use check','Ladder inspection','POWRA','Portable tools check'];log.push(['09:'+(10+Math.floor(seed(d,4)*40)),'Form',fm[Math.floor(seed(d,6)*4)]+' – passed','TSL 101','ok','Worker 3']);
    if(d.getDay()===5)log.push(['16:00','Weekly check','Fire extinguishers & hose reels – done','TSL 101','ok','Worker 1']);}
  inc.forEach(x=>log.push(['11:40','Incident',x[0]+' – '+x[1],x[2],'wn','Worker 3']));
  log.sort((a,b)=>a[0]<b[0]?-1:1);return {ptw,sitesDone,inc,log,t,b};}
function dateBar(){const nx=new Date(selDate);nx.setDate(nx.getDate()+1);const atT=sameDay(selDate,TODAY);

 step('Send it and attach the saved PDF','WhatsApp and email open with the message filled in. Attach the PDF from your Downloads before you press Send.',`<button class="btn">Open company WhatsApp</button><button class="btn">Open email</button>`)+
 (isMgr?'':`<div class="sub" style="padding-top:12px">Download Updated HTML is available in Manager / admin view only.</div>`)+`</div></div>`},
rabrief(){const acts=['Material handling & storage','Use of hand tools & power tools','Work at height – MEWP','Hot work – welding & cutting','Electrical isolation (LOTO)','Housekeeping'];
 const isMgr=role==='manager';
 return demo+head('RA Briefing','Brief the team on the risk assessment for today\'s work activities.',`<button class="btn" data-go="toolbox">Back to Toolbox Meeting</button>`)+
 `<div class="card sect"><div class="h2">1. Work activities <span class="s">Tick today's activities</span></div><div class="fbar"><span class="fin">${ic('search',16)}<input id="q" placeholder="Search activities"></span></div>
  <div class="roster" style="padding-top:14px">${acts.map((a,i)=>`<div class="wk ${i==2||i==4?'on':''}"><span class="bx">${i==2||i==4?ic('check',12):''}</span><div><b>${a}</b><span class="sub">RA-${String(i+6).padStart(2,'0')}</span></div></div>`).join('')}</div></div>
 <div class="card sect"><div class="h2">2. Hazards, risks and controls</div><div class="tw"><table><thead><tr><th>Hazard</th><th>Risk</th><th>Controls</th><th>Residual</th></tr></thead><tbody>
  <tr><td><b>Fall from MEWP platform</b></td><td><span class="risk rH">H</span></td><td>Harness clipped to anchor; trained operator; pre-use check</td><td><span class="risk rM">M</span></td></tr>
  <tr><td><b>MEWP overturning</b></td><td><span class="risk rH">H</span></td><td>Firm level ground; outriggers set; barricade work zone</td><td><span class="risk rL">L</span></td></tr>
  <tr><td><b>Contact with live conductor</b></td><td><span class="risk rH">H</span></td><td>Isolate, lock and tag; test for dead before work</td><td><span class="risk rL">L</span></td></tr></tbody></table></div></div>
 <div class="card sect"><div class="h2">3. RA briefing acknowledgement</div><div class="form"><label class="f">Briefing date<span class="in2 num">12/11/2026</span></label><label class="f">Briefing time<span class="in2 num">07:40</span></label><label class="f">Briefed by<span class="in2">Worker 1 · Supervisor</span></label></div>
  <div class="roster">${WORKERS.filter(w=>w[4]!='rd').slice(0,3).map((w,i)=>`<div class="wk on"><span class="bx">${ic('check',12)}</span><div><b>${w[0]}</b><span class="sub">Signed 07:4${i+2}</span></div></div>`).join('')}</div></div>
 <div class="card sect"><div class="rabacts"><button class="btn">Save draft</button><button class="btn">${ic('pdf',16)}Preview RA PDF</button><button class="btn p">Submit RA briefing</button><span class="sp"></span>${isMgr?`<button class="btn d" data-toast="In the real app this runs the existing Download Updated HTML function.">${ic('dl',16)}Download Updated HTML</button>`:''}</div>
  ${isMgr?'':`<div class="sub" style="padding:0 16px 14px">Download Updated HTML is available in Manager / admin view only.</div>`}</div>`},
swp(){return demo+head('Safe Work Procedures','6 procedures in the library','<button class="btn p">New SWP</button>')+`<div class="card sect"><div class="tw"><table><thead><tr><th>SWP</th><th>Title</th><th>Revision</th><th>Status</th></tr></thead><tbody>${SWPS.map(s=>`<tr><td class="id">${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td><span class="pill ${s[3]}">${s[3]=='ok'?'Current':'Review due'}</span></td></tr>`).join('')}</tbody></table></div></div>`},
forms(){const f=[['POWRA','Point-of-work risk assessment'],['Ladder inspection','Before every use'],['Scaffold inspection','Weekly and after changes'],['MEWP pre-use check','Daily before operation'],['Portable tools check','Monthly tagging'],['Lifting gear','Before each lift']];
 return demo+head('Forms and inspections','Pick a form to fill in on site')+`<div class="g3">${f.map(x=>`<button class="card" style="padding:16px;text-align:left;display:flex;gap:12px;border:1px solid var(--line)"><span class="qi">${ic('forms')}</span><span><b>${x[0]}</b><span class="sub">${x[1]}</span></span></button>`).join('')}</div>
 <div class="card"><div class="h2">Recent submissions</div><div class="empty"><span class="ic">${ic('check',16)}</span>No forms submitted yet this week.</div></div>`},
incidents(){return demo+head('Incidents and near misses','Report anything unsafe. Reports go to the safety team straight away.',`<button class="btn p">${ic('plus',16)}Report incident / near miss</button>`)+
 `<div class="kp" style="grid-template-columns:repeat(4,1fr)"><button><div class="n">0</div><div class="l">Open</div><span class="pill ok">None open</span></button><button><div class="n">2</div><div class="l">Near misses this month</div><span class="pill nt">Logged</span></button><button><div class="n">0</div><div class="l">Lost-time injuries</div><span class="pill ok">0 this year</span></button><button><div class="n">146</div><div class="l">Days without LTI</div><span class="pill ok">Since 18 Jun 2026</span></button></div>
 <div class="card"><div class="tw"><table><thead><tr><th>Ref</th><th>Type</th><th>Site</th><th>Date</th><th>Status</th></tr></thead><tbody>
 <tr><td class="id">NM-0007</td><td>Near miss – unsecured tool at height</td><td>TSL 101</td><td class="num">04/11/2026</td><td><span class="pill ok">Closed</span></td></tr>
 <tr><td class="id">NM-0006</td><td>Near miss – blocked fire exit</td><td>Project site B</td><td class="num">29/10/2026</td><td><span class="pill ok">Closed</span></td></tr></tbody></table></div></div>`},
training(){return demo+head('Training','Course records and renewals','<button class="btn p">Add training record</button>')+`<div class="card"><div class="tw"><table><thead><tr><th>Worker</th><th>Course</th><th>Expiry</th><th>Status</th></tr></thead><tbody>${WORKERS.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[2]}</td><td class="num">${w[3]}</td><td><span class="pill ${w[4]}">${w[4]=='ok'?'Valid':w[4]=='wn'?'Expires soon':'Expired'}</span></td></tr>`).join('')}</tbody></table></div></div>`},
workers(){return demo+head('Workers','6 workers on the roster','<button class="btn p">Add worker</button>')+`<div class="card"><div class="fbar"><span class="fin">${ic('search',16)}<input id="q" placeholder="Search name or trade"></span><span class="cnt">6 workers</span></div><div class="tw"><table><thead><tr><th>Name</th><th>Trade</th><th>Course</th><th>Can sign</th><th>Expiry</th></tr></thead><tbody>${WORKERS.map(w=>`<tr><td><b>${w[0]}</b></td><td>${w[1]}</td><td>${w[2]}</td><td><span class="pill ${w[4]=='rd'?'rd':'ok'}">${w[4]=='rd'?'No – renew course':'Yes'}</span></td><td class="num">${w[3]}</td></tr>`).join('')}</tbody></table></div></div>`},
reports(){return demo+head('Reports','Monthly summaries and exports')+`<div class="g3">${[['Monthly safety report','November 2026 · PDF','pdf'],['Toolbox sign-off log','Last 30 days · Excel','dl'],['RA register export','All 12 RAs · Excel','dl'],['Permit log','All permits · PDF','pdf'],['Competency report','Expiring in 60 days · PDF','pdf'],['Full backup','Everything incl. signatures and photos','dl']].map(r=>`<div class="card" style="padding:16px;display:flex;gap:12px;align-items:center"><span class="qi">${ic(r[2])}</span><span style="flex:1;min-width:0"><b>${r[0]}</b><span class="sub">${r[1]}</span></span><button class="btn sm" data-toast="In the real app this runs the existing export.">Create</button></div>`).join('')}</div>`},
setup(){return demo+head('Settings','Sites, notifications, display and data')+`<div class="g2"><div class="card"><div class="h2">Display size</div><div style="padding:16px"><div class="seg" role="group" aria-label="Display size">${[60,70,80,90,100].map(z=>`<button aria-pressed="${z==60}">${z}%</button>`).join('')}</div><p class="sub" style="margin-top:10px">Constructech Compact Display Standard. Default 60%.</p></div></div>
<div class="card"><div class="h2">Sites</div><div class="tw"><table><tbody><tr><td><b>TSL 101 Eunos</b></td><td><span class="pill ok">Active</span></td></tr><tr><td><b>Project site B</b></td><td><span class="pill ok">Active</span></td></tr></tbody></table></div></div>
<div class="card"><div class="h2">Data on this device</div><div style="padding:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Full backup</button><button class="btn">Restore from backup</button><button class="btn d">Download Updated HTML</button></div></div>
<div class="card"><div class="h2">WhatsApp and email</div><div style="padding:16px" class="sub">Delivery settings are kept exactly as in the current app.</div></div></div>`}
};

function renderRA(){const tb=document.getElementById('tb');if(!tb)return;const q=(document.getElementById('q').value||'').toLowerCase();const f=(document.querySelector('#raSeg [aria-pressed="true"]')||{}).dataset?.f||'all';
  const rows=RAS.filter(r=>(f=='all'||(f=='nohz'&&!r[4])||(f=='H'&&r[3]=='H'))&&(r.join(' ').toLowerCase().includes(q)));
  tb.innerHTML=rows.map(r=>`<tr><td class="id">${r[0]}</td><td>${r[1]}</td><td><span class="risk r${r[3]}">${r[3]}</span></td><td>${r[4]?`<span class="pill ok">${r[4]} hazards</span>`:'<span class="pill rd">No hazards entered</span>'}</td><td>${r[2]}</td><td class="num">${r[5]}</td></tr>`).join('')||'<tr><td colspan="6" class="sub" style="padding:20px 16px">No RAs match this search.</td></tr>';
  document.getElementById('cnt').textContent=rows.length+' of '+RAS.length;}

function bindView(){
  const seg=document.querySelectorAll('.seg');seg.forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;s.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderRA();}));
  const q=document.getElementById('q');if(q)q.addEventListener('input',renderRA);renderRA();
}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400);}
function go(id){if(id==='more')return openMore();closeLayer();if(location.hash!=='#'+id)location.hash=id;else setView(id);}
function closeLayer(){document.getElementById('layer').innerHTML='';}
function openMore(){const items=['weekly','register','swp','forms','training','workers','reports','setup'].filter(allowed);
  document.getElementById('layer').innerHTML=`<div class="sheet-bg" data-close></div><div class="sheet" role="dialog" aria-label="More sections"><div class="grab"></div><div class="grid">${items.map(i=>`<button data-go="${i}">${ic(i,22)}${NAME[i]}</button>`).join('')}</div></div>`;}
let palIdx=0;
function openPal(){const items=[...Object.keys(NAME).filter(allowed).map(k=>({go:k,t:NAME[k],k:'Section',i:k})),...RAS.map(r=>({go:'register',t:r[0]+' · '+r[1],k:'RA',i:'register'})),...PTW.map(p=>({go:'permits',t:p[0]+' · '+p[1],k:'Permit',i:'permits'})),...WORKERS.map(w=>({go:'workers',t:w[0]+' · '+w[1],k:'Worker',i:'workers'})),...SWPS.map(s=>({go:'swp',t:s[0]+' · '+s[1],k:'SWP',i:'swp'}))];
  document.getElementById('layer').innerHTML=`<div class="pal-bg" data-close><div class="pal" role="dialog" aria-label="Search"><label class="fin">${ic('search',18)}<input id="palQ" placeholder="Search RA, permit, worker, SWP or section" autocomplete="off"></label><ul id="palL"></ul></div></div>`;
  const inp=document.getElementById('palQ'),L=document.getElementById('palL');
  const draw=()=>{const q=inp.value.toLowerCase();const r=items.filter(x=>allowed(x.go)&&x.t.toLowerCase().includes(q)).slice(0,9);palIdx=Math.min(palIdx,Math.max(r.length-1,0));
    L.innerHTML=r.map((x,n)=>`<li><button data-go="${x.go}" class="${n==palIdx?'act':''}">${ic(x.i,16)}${x.t}<span class="k">${x.k}</span></button></li>`).join('')||'<li class="sub" style="padding:12px">No matches. Try an RA number like RA-09.</li>';};
  inp.addEventListener('input',()=>{palIdx=0;draw()});
  inp.addEventListener('keydown',e=>{const n=L.querySelectorAll('button').length;if(e.key==='ArrowDown'){palIdx=(palIdx+1)%Math.max(n,1);draw();e.preventDefault()}if(e.key==='ArrowUp'){palIdx=(palIdx-1+n)%Math.max(n,1);draw();e.preventDefault()}if(e.key==='Enter'){const b=L.querySelector('.act');if(b)go(b.dataset.go)}});
  draw();inp.focus();}

document.addEventListener('click',e=>{
  if(e.target.matches('[data-close]')){closeLayer();return}
  const t=e.target.closest('[data-toast]');if(t){toast(t.dataset.toast);return}
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  if(e.target.closest('#openPal,#openPal2'))openPal();
  const rp=e.target.closest('[data-role]');if(rp&&rp.closest('.rolebox')){setRole(rp.dataset.role);return}
  if(e.target.closest('#roleBtn'))openRole();
});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}if(e.key==='Escape')closeLayer();});

document.getElementById('sideNav').innerHTML=NAV.map(g=>`<div class="ngrp"><div class="grp">${g[0]}</div>`+g[1].map(i=>`<button type="button" data-go="${i[0]}">${ic(i[0])}${i[1]}${i[2]?`<span class="badge ${i[3]||''}">${i[2]}</span>`:''}</button>`).join('')+'</div>').join('');applyRole();
document.getElementById('bottomNav').innerHTML=[['home','Home'],['toolbox','Toolbox'],['permits','Permits','2'],['incidents','Incidents'],['more','More']].map(b=>`<button type="button" data-go="${b[0]}">${ic(b[0],20)}${b[1]}${b[2]?`<span class="bd">${b[2]}</span>`:''}</button>`).join('');
document.getElementById('wm').style.backgroundImage='url("'+document.querySelector('.logo').src+'")';
updateTodayChip();
window.addEventListener('hashchange',()=>setView(location.hash.slice(1)));
setView(location.hash.slice(1)||'home');
</script>

</body>
